<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Novo Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg"></div>

    <div id="conteudo">
        <header class="topo">
            <div>
                <div id="saudacao" class="saudacao">Olá</div>
                <div id="data" class="data"></div>
            </div>
            <div class="topo-dir">
                <div id="clima" class="clima">
                    <div id="clima-temp" class="clima-temp">--°</div>
                    <div>
                        <div id="clima-desc" class="clima-desc">Carregando clima…</div>
                        <div id="clima-extra" class="clima-extra"></div>
                    </div>
                </div>
                <div id="relogio" class="relogio">--:--</div>
            </div>
        </header>

        <section class="linha" data-linha="favoritos">
            <h2>Favoritos <span class="dica">aperte o número ou o botão colorido do controle para abrir direto</span></h2>
            <div id="favoritos" class="trilho"></div>
        </section>

        <section class="linha" data-linha="filmes">
            <h2>Filmes em alta esta semana</h2>
            <div id="filmes" class="trilho trilho-alto"></div>
        </section>

        <section class="linha" data-linha="uso">
            <h2>Seu uso da TV</h2>
            <div id="uso" class="trilho"></div>
        </section>

        <section class="linha" data-linha="todos">
            <h2>Todos os apps</h2>
            <div id="todos" class="trilho"></div>
        </section>
    </div>

    <div id="detalhe" class="detalhe">
        <img id="detalhe-poster" alt="">
        <div class="detalhe-texto">
            <div id="detalhe-titulo" class="detalhe-titulo"></div>
            <div id="detalhe-info" class="detalhe-info"></div>
            <div id="detalhe-sinopse" class="detalhe-sinopse"></div>
            <div class="detalhe-voltar">Aperte VOLTAR para fechar</div>
        </div>
    </div>

    <div id="aviso" class="aviso"></div>

    <script src="app.js"></script>
</body>
</html>
